---
# cPanel Git Version Control deploy hook.
# Runs in /home/fiwbmawm/DigiProper after cPanel does `git pull`.
# View deployment logs: cPanel → Git Version Control → DigiProper → Manage → Pull or Deploy → Log.
deployment:
  tasks:
    - export PHP=/opt/cpanel/ea-php84/root/usr/bin/php
    - export COMPOSER=/usr/local/bin/composer
    - $PHP $COMPOSER install --no-dev --optimize-autoloader --no-interaction --prefer-dist
    - $PHP artisan migrate --force
    - $PHP artisan config:cache
    - $PHP artisan route:cache
    - $PHP artisan view:cache
    - $PHP artisan event:cache
    - $PHP artisan queue:restart || true
    - $PHP artisan storage:link || true
